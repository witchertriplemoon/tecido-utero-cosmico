<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Tecido do Útero Cósmico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0b2e 0%, #0d0414 100%);
            color: #f3f0f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #e2b714;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #d1c7d6;
        }

        .btn-amazon {
            display: inline-block;
            background-color: #ff9900;
            color: #111;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.4);
        }

        .btn-amazon:hover {
            background-color: #ffaa1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.6);
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #887b94;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>O Tecido do Útero Cósmico</h1>
        <p>Mergulhe nesta leitura transformadora. Descubra os segredos e reflexões presentes nesta obra disponível exclusivamente digital.</p>
        
        <a href="https://www.amazon.com.br/tecido-%C3%BAtero-c%C3%B3smico-Feminino-Conciliando-ebook/dp/B0HHMWTMBC/" target="_blank" class="btn-amazon">
            Comprar na Amazon
        </a>

        <footer>
            Disponível em e-book na Amazon Brasil.
        </footer>
    </div>

</body>
</html>
